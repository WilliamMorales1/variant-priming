<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pair labeler</title>
<style>
:root{--bg:#fff;--fg:#222;--mut:#777;--card:#f4f4f6;--acc:#2a6df4;--on:#1b8a4b;--off:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#eee;--mut:#999;--card:#26262b}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;max-width:760px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border-radius:10px;padding:14px;margin:12px 0}
.txt{color:var(--mut);margin:4px 0 10px}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}
.row b{min-width:150px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #8884;background:var(--bg);color:var(--fg);cursor:pointer}
button.sel.plus{background:var(--on);color:#fff}button.sel.minus{background:var(--off);color:#fff}
button.play{background:var(--acc);color:#fff;border:0}
.nav{display:flex;gap:8px}
small{color:var(--mut)}
</style></head><body>
<header><h2 id="h">Pair labeler</h2><div class="nav"><button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button></div></header>
<small id="prog"></small>
<div class="row"><label><input type="checkbox" id="dn" checked> Denoised audio</label></div>
<div id="cards"></div>
<p><small>1/2 play v1/v2. Checkbox switches between denoised and original audio.<br>
Per card: L = liaison +, Shift+L = liaison -, V = close-mid +, Shift+V = close-mid -. Keys act on the last played version. Arrows move between pairs.</small></p>
<script>
let dnOK=false,items=[],labels={},pairs=[],i=0,cur=0;
const $=s=>document.querySelector(s);
const audio=new Audio();
async function init(){
  const d=await (await fetch('/api/data')).json();
  items=d.items;dnOK=d.has_denoised;if(!dnOK){$('#dn').checked=false;$('#dn').disabled=true;}labels=d.labels;
  const m={};items.forEach(it=>(m[it.sentence]??=[]).push(it));
  pairs=Object.entries(m).sort();
  const first=pairs.findIndex(([,v])=>v.some(it=>!(labels[it.file]?.liaison&&labels[it.file]?.close_mid_vowel)));
  i=first<0?0:first;render();
}
function render(){
  const [sid,vs]=pairs[i];
  $('#h').textContent=sid;
  const done=pairs.filter(([,v])=>v.every(it=>labels[it.file]?.liaison&&labels[it.file]?.close_mid_vowel)).length;
  $('#prog').textContent=`pair ${i+1}/${pairs.length}, ${done} complete`;
  $('#cards').innerHTML='';
  vs.forEach((it,k)=>{
    const l=labels[it.file]||{};
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`<div><button class="play">&#9654; Play ${it.version}</button></div><div class="txt">${it.text}</div>`;
    c.querySelector('.play').onclick=()=>play(k);
    for(const [key,name] of [['liaison','Liaison'],['close_mid_vowel','Close-mid vowel']]){
      const r=document.createElement('div');r.className='row';r.innerHTML=`<b>${name}</b>`;
      for(const v of ['+','-']){
        const b=document.createElement('button');b.textContent=v;
        b.className=(l[key]===v?'sel ':'')+(v==='+'?'plus':'minus');
        b.onclick=()=>set(it.file,key,v);r.appendChild(b);
      }
      c.appendChild(r);
    }
    $('#cards').appendChild(c);
  });
}
function play(k){cur=k;const it=pairs[i][1][k];audio.src='/audio/'+($('#dn').checked?'denoised':'orig')+'/'+encodeURIComponent(it.file);audio.currentTime=0;audio.play();}
async function set(file,key,v){
  (labels[file]??={})[key]=v;render();
  await fetch('/api/save',{method:'POST',body:JSON.stringify(labels)});
}
function go(d){i=Math.min(pairs.length-1,Math.max(0,i+d));render();}
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
addEventListener('keydown',e=>{
  const f=pairs[i][1][cur]?.file,k=e.key.toLowerCase();
  if(k==='1')play(0);else if(k==='2')play(1);
  else if(k==='arrowright')go(1);else if(k==='arrowleft')go(-1);
  else if(k==='l'&&f)set(f,'liaison',e.shiftKey?'-':'+');
  else if(k==='v'&&f)set(f,'close_mid_vowel',e.shiftKey?'-':'+');
});
init();
</script></body></html>
